[package]
name = "pchi-studio-api"
version = "0.1.0"
edition = "2021"
description = "Runs a showchart and serves its live state to Studio over HTTP + WebSocket."

[[bin]]
name = "pchi-studio-api"
path = "src/main.rs"

[dependencies]
pchi-showchart = { path = "../pchi-showchart" }
pchi-eventstore = { path = "../pchi-eventstore" }
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1.34", features = ["full"] }
futures-util = "0.3"
serde_json = "1.0"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1.0"

[dev-dependencies]
tokio = { version = "1.34", features = ["test-util"] }
tokio-tungstenite = "0.24"
