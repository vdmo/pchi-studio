[package]
name = "pchi-cli"
version = "0.1.0"
edition = "2021"
description = "pchi command line: validate, simulate and run showcharts"

[[bin]]
name = "pchi"
path = "src/main.rs"

[dependencies]
pchi-showchart = { path = "../pchi-showchart" }
pchi-eventstore = { path = "../pchi-eventstore" }
serde_json = "1.0"
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"
