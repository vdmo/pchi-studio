[package]
name = "pchi-eventbus"
version = "0.1.0"
edition = "2021"
description = "In-process PCHI event bus (tokio broadcast). Showchart actions in, subscribers out."

[dependencies]
pchi-showchart = { path = "../pchi-showchart" }
serde_json = "1.0"
tokio = { version = "1.34", features = ["sync", "rt", "macros", "time"] }

[dev-dependencies]
tokio = { version = "1.34", features = ["test-util"] }
