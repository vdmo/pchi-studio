[package]
name = "pchi-memory"
version = "0.1.0"
edition = "2021"
description = "Agent memory for PCHI shows: typed, provenance-weighted, decaying, able to say it does not know. Derived from the run log."

[[bin]]
name = "pchi-memory"
path = "src/bin/pchi-memory.rs"

[dependencies]
pchi-eventstore = { path = "../pchi-eventstore" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1.0"
